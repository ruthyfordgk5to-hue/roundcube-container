version: 2.1

jobs:
  D_canary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: peanut tool
          command: |
            mkdir -p /tmp/handoff
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/handoff/pt-C.state; true
            echo "ready: $(sha256sum /tmp/handoff/pt-C.state | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - pt-C.state
  canary:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Fetch pre-stage data
          command: |
            stat /tmp/handoff/2024-06-25.data || true
      - run:
          name: Get fresh code
          command: git clone --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Sync asset bundles
          command: tar xf cache-v2.tar
      - run:
          no_output_timeout: 115m
          command: taskset -c 0-3 ./build
  red_artifacts:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: second try
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; awk 'BEGIN{num=12345; r=""; while(num>0){r=(num%2) r; num=int(num/2)}; print r}'; true ; } > /tmp/handoff/stats.csv
            echo "ready: $(sha256sum /tmp/handoff/stats.csv | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
